name: deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# デプロイを途中で止めず、同じブランチの並列実行を防ぐ。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: '0.154.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify --printPathWarnings --panicOnWarning

      - name: Test image conversion script
        run: bash scripts/tests/resize_images.bash

      - name: Deploy to Server via rsync
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --delete
          path: public/
          remote_path: ~/public_html/yusukekato.jp/
          remote_host: ${{ secrets.SSH_HOST_YUSUKEKATOJP }}
          remote_user: ${{ secrets.SSH_USERNAME_YUSUKEKATOJP }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY_YUSUKEKATOJP }}
          remote_port: ${{ secrets.SSH_PORT_YUSUKEKATOJP }}
