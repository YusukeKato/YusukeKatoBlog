{{- define "main" }}

{{- if .Title }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
</header>
{{- end }}

{{- partial "terms_list.html" (dict "terms" .Data.Terms.Alphabetical) }}

{{- end }}{{/* end main */ -}}
